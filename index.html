<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101426">
  <meta name="description" content="PixelBot, un petit compagnon de bureau rétro qui réagit aux sons et aux caresses.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>PixelBot</title>
</head>
<body>
  <main class="cabinet" aria-label="PixelBot, compagnon de bureau">
    <div class="topline">
      <span class="brand">PIXEL<span>BOT</span></span>
      <span class="status"><i id="status-dot"></i><span id="status-label">EN VEILLE</span></span>
    </div>

    <section class="stage">
      <div class="scanlines"></div>
      <div class="stars" aria-hidden="true">
        <span>✦</span><span>·</span><span>✧</span><span>·</span><span>✦</span>
      </div>
      <div id="particles" class="particles" aria-hidden="true"></div>
      <div class="speech" id="speech" aria-live="polite">Zzz...</div>
      <button class="pet-button" id="pet-button" aria-label="Caresser PixelBot">
        <img id="pet" src="./assets/sleep_1.png" alt="Petit robot PixelBot endormi" draggable="false">
      </button>
      <div class="tap-hint">TOUCHE-MOI POUR ME CARESSER</div>
      <div class="floor-glow"></div>
    </section>

    <section class="meter-panel">
      <div class="meter-head"><span>SON AMBIANT</span><span id="volume-value">0%</span></div>
      <div class="meter"><div id="meter-fill"></div><i class="threshold t1"></i><i class="threshold t2"></i></div>
      <div class="meter-labels"><span>SILENCE</span><span>DOUX</span><span>FORT</span></div>
    </section>

    <section class="controls">
      <button id="start-button" class="primary">▶ ACTIVER LE MICRO</button>
      <button id="sound-button" class="secondary" aria-pressed="true">♫ SON ON</button>
    </section>
    <p class="notice" id="notice">Appuie sur ACTIVER pour autoriser le micro. Le son est analysé localement et n'est pas enregistré.</p>
    <footer><span>PIXEL PET v1.0</span><span>MADE WITH ♥</span></footer>
  </main>
  <script src="./app.js"></script>
</body>
</html>
